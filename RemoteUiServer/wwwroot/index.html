<!doctype html>
<meta charset="utf-8">
<title>ImGui Remote UI (PNG over WebSocket)</title>
<style>
  html, body { background:#111; margin:0; height:100%; }
  #wrap { display:flex; align-items:center; justify-content:center; height:100%; }
  canvas { background:#222; image-rendering: pixelated; }
  #info { position: fixed; top: 8px; left: 8px; color:#ddd; font: 14px/1.3 system-ui, sans-serif; }
</style>
<div id="wrap">
  <canvas id="cv" width="1280" height="720"></canvas>
</div>
<div id="info">WS 연결 중...</div>
<script>
const info = document.getElementById('info');
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');

const renderWidth = canvas.width, renderHeight = canvas.height;

const videoSock = new WebSocket(location.origin.replace('http', 'ws') + '/ws/video');
videoSock.binaryType = 'arraybuffer';
videoSock.onopen = () => info.textContent = '영상 소켓 연결됨';
videoSock.onmessage = async (ev) => {
  const blob = new Blob([ev.data], {type:'image/png'});
  const bmp = await createImageBitmap(blob);
  ctx.drawImage(bmp, 0, 0, renderWidth, renderHeight);
};

const inputSock = new WebSocket(location.origin.replace('http', 'ws') + '/ws/input');
inputSock.onopen = () => info.textContent = '입력 소켓 연결됨';
function send(o){ if (inputSock.readyState === WebSocket.OPEN) inputSock.send(JSON.stringify(o)); }

function toRenderSpace(evt) {
  const r = canvas.getBoundingClientRect();
  const sx = renderWidth / r.width;
  const sy = renderHeight / r.height;
  const x = (evt.clientX - r.left) * sx;
  const y = (evt.clientY - r.top) * sy;
  return {x, y};
}
canvas.addEventListener('mousemove', e => {
  const {x,y} = toRenderSpace(e);
  send({type:"mouseMove", x, y});
});
canvas.addEventListener('mousedown', e => {
  const {x,y} = toRenderSpace(e);
  const btn = e.button; // 0:left 1:middle 2:right
  send({type:"mouseDown", x, y, btn});
});
canvas.addEventListener('mouseup', e => {
  const {x,y} = toRenderSpace(e);
  const btn = e.button;
  send({type:"mouseUp", x, y, btn});
});
canvas.addEventListener('wheel', e => {
  send({type:"wheel", dx:e.deltaX, dy:e.deltaY});
  e.preventDefault();
}, {passive:false});

window.addEventListener('keydown', e => {
  send({type:"key", code:e.code, down:true});
  if (e.key && e.key.length === 1) {
    // Simple text path (IME는 별도 처리 필요)
    send({type:"text", utf8: e.key});
  }
});
window.addEventListener('keyup', e => send({type:"key", code:e.code, down:false}));

</script>
